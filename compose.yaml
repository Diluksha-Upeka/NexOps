services:
  postgres:
    image: postgres:16.4-alpine
    container_name: nexops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-incident_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-incident_lab}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-incident_app} -d ${POSTGRES_DB:-incident_lab}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

  # --- Containerized Application Service (Phase 8: Deployment Rehearsal) ---
  app:
    profiles: [full, app]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexops-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-incident_app}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-incident_lab}
      CHECKPOINT_DATABASE_URL: postgresql://${POSTGRES_USER:-incident_app}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-incident_lab}
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      SIMULATOR_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # --- Observability profile (Phase 7) ---
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v2.54.0
    container_name: nexops-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=3d"
      - "--web.enable-lifecycle"
    deploy:
      resources:
        limits:
          memory: 256M

  grafana:
    profiles: [observability]
    image: grafana/grafana:11.2.0
    container_name: nexops-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./dashboards/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256M

  jaeger:
    profiles: [observability]
    image: jaegertracing/all-in-one:1.60
    container_name: nexops-jaeger
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686" # Web UI
      - "127.0.0.1:4318:4318"   # OTLP HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  pgdata:
    driver: local
  promdata:
    driver: local
  grafanadata:
    driver: local
