# Alembic configuration

[alembic]
script_location = migrations
prepend_sys_path = .

# Connection string — overridden programmatically in migrations/env.py
# to use the application settings. This fallback is for CLI-only usage.
sqlalchemy.url = postgresql+psycopg://incident_app:change-me@localhost:5432/incident_lab

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
